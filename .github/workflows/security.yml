# Checks every push and pull request: types, tests, and the security checks in
# dev/security/check.sh. It has no secrets and no access to AWS, so it's safe
# to run on anyone's pull request. Publishing is separate (deploy/buildspec.yml)
# and runs the same security checks again before it publishes.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # The desktop app's tests need Rust, and its code never reaches the server.
      - run: for folder in talos talos-server talos-shared talos-web; do (cd "$folder" && bun test) || exit 1; done

      # GitHub's machines are x86, so the image is built for x86 here. Its
      # system packages are the same as the Arm image AWS runs.
      - run: make server-image SERVER_PLATFORM=linux/amd64
      - run: sh dev/security/check.sh talos-server

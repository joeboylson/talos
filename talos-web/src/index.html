<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Talos</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; }
      button { font-size: 1rem; padding: 0.5rem 1.25rem; }
      ul { padding-left: 1.25rem; font-family: ui-monospace, monospace; }
      section { border: 1px solid #8884; border-radius: 6px; padding: 0.5rem 1rem; margin-bottom: 1rem; }
      h2 { font-size: 1rem; margin: 0.5rem 0; }
    </style>
  </head>
  <body>
    <h1>Talos</h1>

    <!-- Only shown when talos is running on the machine viewing this page. -->
    <section id="this-machine" hidden>
      <h2>This machine</h2>
      <p id="this-machine-status"></p>
    </section>

    <p id="machines">Connecting…</p>
    <button id="ping" disabled>Ping</button>
    <ul id="log"></ul>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
